name: Deploy frontend tp github pages
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: checkout Repository
        uses: actions/checkout@v4
      
      - name: install, build, and upload Astro
        uses: withastro/action@v3
        with:
          path: ./frontend
        
      - name: deploy to GitHub pages
        id: deployment
        uses: actions/configure-pages@v5